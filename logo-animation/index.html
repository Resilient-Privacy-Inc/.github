<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Resilient Privacy — 3D ASCII Logo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: #050508;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    font-family: 'Courier New', Courier, monospace;
    overflow: hidden;
  }

  #canvas { display: none; }

  #output {
    white-space: pre;
    font-size: 9px;
    line-height: 9px;
    letter-spacing: 0;
    user-select: none;
    position: relative;
    z-index: 2;
  }

  #loading {
    color: #555;
    font-size: 14px;
    font-family: 'Courier New', monospace;
  }

  /* Scanline overlay for CRT feel */
  #scanlines {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: repeating-linear-gradient(
      0deg,
      rgba(0,0,0,0) 0px,
      rgba(0,0,0,0) 2px,
      rgba(0,0,0,0.08) 3px,
      rgba(0,0,0,0.08) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* Vignette */
  #vignette {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.6) 100%);
    pointer-events: none;
    z-index: 9;
  }

  @media (max-width: 1200px) {
    #output { font-size: 7px; line-height: 7px; }
  }
  @media (max-width: 768px) {
    #output { font-size: 5px; line-height: 5px; }
  }
  @media (max-width: 480px) {
    #output { font-size: 3.5px; line-height: 3.5px; }
  }
</style>
</head>
<body>

<canvas id="canvas"></canvas>
<div id="loading">Initializing 3D ASCII engine…</div>
<pre id="output"></pre>
<div id="vignette"></div>
<div id="scanlines"></div>

  // ─── DOM ─────────────────────────────────────────────────────
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const output = document.getElementById('output');
  const loading = document.getElementById('loading');

  // ─── Starfield ───────────────────────────────────────────────
  const NUM_STARS = 80;
  const stars = [];
  for (let i = 0; i < NUM_STARS; i++) {
    stars.push({
      x: Math.random() * COLS,
      y: Math.random() * ROWS,
      z: Math.random() * 200 + 50,
      speed: Math.random() * 0.3 + 0.05,
      brightness: Math.random() * 0.5 + 0.2
    });
  }

  // ─── Render SVG to canvas → height map + normals ─────────────
  const img = new Image();
  const svgBlob = new Blob([LOGO_SVG], { type: 'image/svg+xml' });
  const url = URL.createObjectURL(svgBlob);

  img.onload = function () {
    URL.revokeObjectURL(url);
    // Render at higher res for better height map extraction
    const MAP_W = COLS;
    const MAP_H = ROWS;
    canvas.width = MAP_W;
    canvas.height = MAP_H;
    ctx.fillStyle = 'black';
    ctx.fillRect(0, 0, MAP_W, MAP_H);
    ctx.drawImage(img, 0, 0, MAP_W, MAP_H);
    const imgData = ctx.getImageData(0, 0, MAP_W, MAP_H);
    const data = imgData.data;

    // Build height map
    const heightMap = new Float32Array(MAP_W * MAP_H);
    for (let i = 0; i < MAP_W * MAP_H; i++) {
      const r = data[i * 4];
      const g = data[i * 4 + 1];
      const b = data[i * 4 + 2];
      heightMap[i] = (r + g + b) / 765;
    }

    // Compute surface normals via Sobel-like gradient
    const normals = new Float32Array(MAP_W * MAP_H * 3);
    for (let y = 1; y < MAP_H - 1; y++) {
      for (let x = 1; x < MAP_W - 1; x++) {
        const idx = y * MAP_W + x;
        const hL = heightMap[idx - 1];
        const hR = heightMap[idx + 1];
        const hU = heightMap[idx - MAP_W];
        const hD = heightMap[idx + MAP_W];
        // Normal = cross product of tangent vectors
        const dx = (hR - hL) * 2;
        const dy = (hD - hU) * 2;
        const nz = 1.0;
        const len = Math.sqrt(dx * dx + dy * dy + nz * nz);
        normals[idx * 3]     = -dx / len;
        normals[idx * 3 + 1] = -dy / len;
        normals[idx * 3 + 2] = nz / len;
      }
    }

    loading.style.display = 'none';
    canvas.style.display = 'none';
    animate(heightMap, normals, MAP_W, MAP_H);
  };

  img.onerror = function () {
    loading.textContent = 'Failed to load logo SVG';
  };

  img.src = url;

  // ─── Color interpolation ─────────────────────────────────────
  function getColor(t) {
    t = Math.max(0, Math.min(1, t));
    const scaled = t * (NUM_COLORS - 1);
    const i = Math.floor(scaled);
    const f = scaled - i;
    const c1 = PALETTE[i];
    const c2 = PALETTE[Math.min(i + 1, NUM_COLORS - 1)];
    return [
      Math.round(c1[0] + (c2[0] - c1[0]) * f),
      Math.round(c1[1] + (c2[1] - c1[1]) * f),
      Math.round(c1[2] + (c2[2] - c1[2]) * f)
    ];
  }

  // ─── 3D Animation ────────────────────────────────────────────
  function animate(heightMap, normals, mapW, mapH) {
    let angle = 0;
    let wobbleAngle = 0;
    let frameCount = 0;

    // Pre-allocate buffers
    const charBuf = new Array(ROWS);
    const colorBuf = new Array(ROWS);
    const zbuf = new Array(ROWS);
    for (let y = 0; y < ROWS; y++) {
      charBuf[y] = new Array(COLS).fill(' ');
      colorBuf[y] = new Array(COLS);
      for (let x = 0; x < COLS; x++) colorBuf[y][x] = [0, 0, 0];
      zbuf[y] = new Float64Array(COLS).fill(-Infinity);
    }

    // Light direction (normalized)
    const lightDir = { x: -0.3, y: -0.5, z: -0.8 };
    const lightLen = Math.sqrt(lightDir.x ** 2 + lightDir.y ** 2 + lightDir.z ** 2);
    lightDir.x /= lightLen; lightDir.y /= lightLen; lightDir.z /= lightLen;

    function frame() {
      angle += ROT_SPEED;
      wobbleAngle += WOBBLE_SPEED;
      frameCount++;

      const cosA = Math.cos(angle);
      const sinA = Math.sin(angle);
      const cosT = Math.cos(TILT + Math.sin(wobbleAngle) * WOBBLE);
      const sinT = Math.sin(TILT + Math.sin(wobbleAngle) * WOBBLE);
      const cx = COLS / 2;
      const cy = ROWS / 2;

      // Clear buffers
      for (let y = 0; y < ROWS; y++) {
        charBuf[y].fill(' ');
        zbuf[y].fill(-Infinity);
        for (let x = 0; x < COLS; x++) {
          colorBuf[y][x][0] = 0;
          colorBuf[y][x][1] = 0;
          colorBuf[y][x][2] = 0;
        }
      }

      // ── Render starfield ──
      for (let i = 0; i < NUM_STARS; i++) {
        const s = stars[i];
        s.z -= s.speed;
        if (s.z < 10) {
          s.x = Math.random() * COLS;
          s.y = Math.random() * ROWS;
          s.z = 200 + Math.random() * 100;
          s.brightness = Math.random() * 0.4 + 0.1;
        }
        const sscale = FOCAL / (FOCAL + s.z);
        const sx = Math.round(cx + (s.x - cx) * sscale);
        const sy = Math.round(cy + (s.y - cy) * sscale);
        if (sx >= 0 && sx < COLS && sy >= 0 && sy < ROWS) {
          const sb = s.brightness * sscale;
          if (sb > 0.01) {
            const starChar = sb > 0.3 ? '+' : sb > 0.15 ? '.' : ' ';
            if (starChar !== ' ' && zbuf[sy][sx] === -Infinity) {
              charBuf[sy][sx] = starChar;
              const sc = getColor(sb * 0.3);
              colorBuf[sy][sx][0] = sc[0];
              colorBuf[sy][sx][1] = sc[1];
              colorBuf[sy][sx][2] = sc[2];
              zbuf[sy][sx] = -1; // behind everything
            }
          }
        }
      }

      // ── Render 3D logo ──
      for (let py = 0; py < mapH; py++) {
        for (let px = 0; px < mapW; px++) {
          const idx = py * mapW + px;
          const h = heightMap[idx];
          if (h < 0.03) continue;

          const x = px - mapW / 2;
          const y = py - mapH / 2;
          const z = h * DEPTH_SCALE;

          // Y-axis rotation
          let rx = x * cosA + z * sinA;
          let rz = -x * sinA + z * cosA;

          // X-axis tilt (with wobble)
          let ry = y * cosT - rz * sinT;
          rz = y * sinT + rz * cosT;

          // Perspective projection
          const projScale = FOCAL / (FOCAL + rz);
          const sx = Math.round(cx + rx * projScale);
          const sy = Math.round(cy + ry * projScale);

          if (sx < 0 || sx >= COLS || sy < 0 || sy >= ROWS) continue;

          // Z-buffer test
          if (projScale <= zbuf[sy][sx]) continue;
          zbuf[sy][sx] = projScale;

          // ── Lighting: rotate normal, then dot with light ──
          const nx = normals[idx * 3];
          const ny = normals[idx * 3 + 1];
          const nz = normals[idx * 3 + 2];

          // Rotate normal by same Y rotation
          let rnx = nx * cosA + nz * sinA;
          let rnz = -nx * sinA + nz * cosA;
          // Rotate by X tilt
          let rny = ny * cosT - rnz * sinT;
          rnz = ny * sinT + rnz * cosT;

          // Diffuse lighting
          let diffuse = rnx * lightDir.x + rny * lightDir.y + rnz * lightDir.z;
          diffuse = Math.max(0, diffuse);

          // Ambient + diffuse
          const ambient = 0.15;
          const lighting = ambient + diffuse * 0.85;

          // Brightness: combine height, perspective, and lighting
          const depthFactor = Math.min(1, projScale * 0.7);
          let brightness = h * 0.3 + depthFactor * 0.3 + lighting * 0.5;
          brightness = Math.max(0, Math.min(1, brightness));

          // Specular highlight (tight, bright spot)
          const specBase = Math.pow(diffuse, 16);
          const spec = specBase * 0.6;

          // Final brightness with specular
          brightness = Math.min(1, brightness + spec);

          // Character from brightness
          const ci = Math.floor(brightness * (NUM_CHARS - 1));
          charBuf[sy][sx] = CHARS[Math.max(0, Math.min(NUM_CHARS - 1, ci))];

          // Color: map brightness through palette, boost for specular
          const colorT = Math.min(1, brightness * 0.9 + spec * 0.5);
          const col = getColor(colorT);
          colorBuf[sy][sx][0] = col[0];
          colorBuf[sy][sx][1] = col[1];
          colorBuf[sy][sx][2] = col[2];
        }
      }

      // ── Build HTML with per-character color ──
      let html = '';
      for (let y = 0; y < ROWS; y++) {
        let row = '';
        let prevColor = null;
        for (let x = 0; x < COLS; x++) {
          const ch = charBuf[y][x];
          const c = colorBuf[y][x];
          if (ch === ' ') {
            if (prevColor !== null) {
              row += '</span>';
              prevColor = null;
            }
            row += ' ';
          } else {
            const colorStr = c[0] + ',' + c[1] + ',' + c[2];
            if (prevColor !== colorStr) {
              if (prevColor !== null) row += '</span>';
              row += '<span style="color:rgb(' + colorStr + ');text-shadow:0 0 ' +
                     (3 + c[0] / 30) + 'px rgba(' + colorStr + ',0.5)">' + ch;
              prevColor = colorStr;
            } else {
              row += ch;
            }
          }
        }
        if (prevColor !== null) row += '</span>';
        html += row + '\n';
      }
      output.innerHTML = html;

      requestAnimationFrame(frame);
    }

    requestAnimationFrame(frame);
  }
})();
</script>
</body>
</html>
